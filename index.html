<!doctype html>
<html>
<head>
  <meta name="description" content="ASCII Camera - Turn your webcam into ASCII art of your face">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <meta name="keywords" content="ascii, webcam, camera, art, face, video">
  <meta name="author" content="Grigor Stoyanov">
  <meta name="theme-color" content="#000000">
  <!-- link preview card (Discord, WhatsApp, X…) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://grigor-stoyanov.github.io/ascii-webcam/">
  <meta property="og:title" content="ASCII Camera">
  <meta property="og:description" content="Turn your webcam into live ASCII art of your face, right in your browser.">
  <meta property="og:image" content="https://grigor-stoyanov.github.io/ascii-webcam/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/styles/main.css">
  <title>ASCII Camera</title>
</head>
<body>
  <div class="video-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
  <div id="status" class="status">
    <p id="status-message">Loading face tracking…</p>
    <button id="status-retry" type="button" hidden>Try again</button>
    <p class="status-note">Your camera never leaves your device. Everything runs in your browser.</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
